name: Windows RustDesk

on:
  workflow_dispatch:

jobs:
  windows:
    name: Start Windows RustDesk
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ==============================
      # 1. Download RustDesk
      # ==============================
      - name: Download RustDesk
        shell: powershell
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.1/rustdesk-1.2.1-x86_64.exe"
          $exe = "$env:TEMP\rustdesk.exe"

          Write-Host "Downloading RustDesk..."

          curl.exe -L --retry 5 --retry-delay 5 `
            -o "$exe" `
            "$url"

          if (!(Test-Path $exe)) {
              Write-Host "Download failed."
              exit 1
          }

          $size = (Get-Item $exe).Length

          Write-Host "Downloaded file size: $size bytes"

          if ($size -lt 1000000) {
              Write-Host "Downloaded file looks invalid."
              exit 1
          }

          Write-Host "RustDesk downloaded successfully."

      # ==============================
      # 2. Install RustDesk
      # ==============================
      - name: Install RustDesk
        shell: powershell
        run: |
          $exe = "$env:TEMP\rustdesk.exe"

          Write-Host "Installing RustDesk..."

          $p = Start-Process `
            -FilePath $exe `
            -ArgumentList "--silent-install" `
            -PassThru

          Write-Host "Installer PID: $($p.Id)"

          $finished = $p.WaitForExit(60000)

          if (!$finished) {
              Write-Host "Installer timeout."
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

          Start-Sleep -Seconds 5

          $paths = @(
              "C:\Program Files\RustDesk\rustdesk.exe",
              "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          )

          $rustdesk = $paths |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

          if (!$rustdesk) {
              Write-Host "RustDesk executable not found."
              exit 1
          }

          Write-Host "RustDesk installed successfully."
          Write-Host "Path: $rustdesk"

      # ==============================
      # 3. Start RustDesk
      # ==============================
      - name: Start RustDesk
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
              $rustdesk = "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          }

          if (!(Test-Path $rustdesk)) {
              Write-Host "RustDesk executable not found."
              exit 1
          }

          Write-Host "Starting RustDesk..."

          Start-Process `
            -FilePath $rustdesk `
            -WindowStyle Hidden

          Start-Sleep -Seconds 20

          $process = Get-Process `
            -Name "rustdesk" `
            -ErrorAction SilentlyContinue

          if ($process) {
              Write-Host "RustDesk process is running."
          }
          else {
              Write-Host "RustDesk process is NOT running."
              exit 1
          }

      # ==============================
      # 4. Check RustDesk Config
      # ==============================
      - name: Read RustDesk Configuration
        shell: powershell
        run: |
          Write-Host "Searching RustDesk configuration..."

          $files = @(
              "$env:APPDATA\RustDesk\config\RustDesk.toml",
              "$env:APPDATA\RustDesk\config\RustDesk2.toml",
              "$env:APPDATA\RustDesk\config\RustDesk_local.toml",
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config\RustDesk.toml",
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config\RustDesk2.toml"
          )

          foreach ($file in $files) {

              Write-Host ""
              Write-Host "=============================="
              Write-Host "FILE: $file"
              Write-Host "=============================="

              if (Test-Path $file) {
                  Get-Content $file
              }
              else {
                  Write-Host "File not found."
              }
          }

      # ==============================
      # 5. RustDesk Logs
      # ==============================
      - name: Check RustDesk Logs
        shell: powershell
        run: |
          Write-Host "Checking RustDesk logs..."

          $logs = @(
              "$env:APPDATA\RustDesk\log\silent-install\rustdesk_rCURRENT.log",
              "$env:APPDATA\RustDesk\log\check-hwcodec-config\rustdesk_rCURRENT.log",
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\log\service\RustDesk_rCURRENT.log",
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\log\server\RustDesk_rCURRENT.log"
          )

          foreach ($log in $logs) {

              Write-Host ""
              Write-Host "=============================="
              Write-Host "LOG: $log"
              Write-Host "=============================="

              if (Test-Path $log) {
                  Get-Content $log -Tail 100
              }
          }

      # ==============================
      # 6. Try Get RustDesk ID
      # ==============================
      - name: Try Get RustDesk ID
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
              $rustdesk = "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          }

          Write-Host "RustDesk executable:"
          Write-Host $rustdesk

          Write-Host ""
          Write-Host "Trying --get-id..."

          $result = & $rustdesk --get-id 2>&1

          Write-Host "Result:"
          Write-Host $result

          Write-Host ""
          Write-Host "ID check completed."

      # ==============================
      # 7. Keep Runner Alive
      # ==============================
      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "===================================="
          Write-Host "RustDesk is running."
          Write-Host "Windows runner is alive."
          Write-Host "Keeping session alive..."
          Write-Host "===================================="

          Start-Sleep -Seconds 18000
