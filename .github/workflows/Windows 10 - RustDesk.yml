name: Windows RustDesk

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      - name: Install RustDesk
        shell: powershell
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/latest/download/rustdesk.exe"
          $exe = "$env:TEMP\rustdesk.exe"

          Write-Host "Downloading RustDesk..."
          Invoke-WebRequest -Uri $url -OutFile $exe

          Write-Host "Installing RustDesk..."
          Start-Process $exe -ArgumentList "--silent-install" -Wait

          Start-Sleep -Seconds 10

      - name: Configure RustDesk
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
            Write-Host "RustDesk executable not found"
            exit 1
          }

          Write-Host "Installing RustDesk service..."
          Start-Process $rustdesk -ArgumentList "--install-service" -Wait

          Start-Sleep -Seconds 10

          Write-Host "Starting RustDesk service..."
          Start-Service RustDesk -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 10

          Write-Host "Setting password..."
          Start-Process $rustdesk -ArgumentList "--password MyRustDesk@123" -Wait

          Start-Sleep -Seconds 5

          Write-Host "================================"
          Write-Host "RustDesk ID:"
          & $rustdesk --get-id
          Write-Host "Password: MyRustDesk@123"
          Write-Host "================================"

      - name: Keep Windows Runner Alive
        shell: powershell
        run: |
          Write-Host "Windows runner is running..."
          Write-Host "Keep this workflow In Progress."
          Start-Sleep -Seconds 20400
