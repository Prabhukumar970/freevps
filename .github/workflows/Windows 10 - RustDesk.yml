name: Windows RustDesk

on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows RustDesk Runner
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # 1. Download RustDesk
      # ==========================================
      - name: Download RustDesk
        shell: powershell
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.1/rustdesk-1.2.1-x86_64.exe"
          $file = "$env:TEMP\rustdesk.exe"

          Write-Host "Downloading RustDesk..."

          curl.exe -L --retry 5 --retry-delay 5 `
            -o "$file" `
            "$url"

          if (!(Test-Path $file)) {
              Write-Host "RustDesk download failed."
              exit 1
          }

          $size = (Get-Item $file).Length

          Write-Host "Downloaded size: $size bytes"

          if ($size -lt 1000000) {
              Write-Host "Invalid RustDesk file."
              exit 1
          }

          Write-Host "RustDesk download OK."

      # ==========================================
      # 2. Install RustDesk
      # ==========================================
      - name: Install RustDesk
        shell: powershell
        run: |
          $installer = "$env:TEMP\rustdesk.exe"

          Write-Host "Installing RustDesk..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "--silent-install" `
            -Wait

          Start-Sleep -Seconds 10

          $paths = @(
              "C:\Program Files\RustDesk\rustdesk.exe",
              "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          )

          $rustdesk = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (!$rustdesk) {
              Write-Host "RustDesk executable not found."
              exit 1
          }

          Write-Host "RustDesk installed:"
          Write-Host $rustdesk

      # ==========================================
      # 3. Clean old RustDesk processes
      # ==========================================
      - name: Clean RustDesk
        shell: powershell
        run: |
          Write-Host "Stopping old RustDesk processes..."

          Get-Process -Name rustdesk `
            -ErrorAction SilentlyContinue |
            Stop-Process -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          Write-Host "Old processes cleaned."

      # ==========================================
      # 4. Start RustDesk
      # ==========================================
      - name: Start RustDesk
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
              $rustdesk = "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          }

          Write-Host "Starting RustDesk..."
          Write-Host $rustdesk

          Start-Process `
            -FilePath $rustdesk

          Start-Sleep -Seconds 30

          Write-Host ""
          Write-Host "RustDesk processes:"

          Get-Process -Name rustdesk `
            -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, Path

      # ==========================================
      # 5. Check RustDesk files
      # ==========================================
      - name: Check RustDesk Configuration
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK CONFIGURATION"
          Write-Host "======================================"

          $locations = @(
              "$env:APPDATA\RustDesk",
              "$env:LOCALAPPDATA\RustDesk",
              "C:\ProgramData\RustDesk",
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk",
              "C:\Windows\ServiceProfiles\LocalService\AppData\Local\RustDesk"
          )

          foreach ($location in $locations) {

              Write-Host ""
              Write-Host "Checking:"
              Write-Host $location

              if (Test-Path $location) {

                  Get-ChildItem `
                    -Path $location `
                    -Recurse `
                    -File `
                    -ErrorAction SilentlyContinue |
                    Select-Object FullName, Length, LastWriteTime

              }
              else {
                  Write-Host "Not found."
              }
          }

      # ==========================================
      # 6. Get RustDesk ID
      # ==========================================
      - name: Get RustDesk ID
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
              $rustdesk = "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK ID"
          Write-Host "======================================"

          Write-Host "Executable:"
          Write-Host $rustdesk

          Write-Host ""
          Write-Host "Trying RustDesk ID command..."

          $result = & $rustdesk --get-id 2>&1

          if ($result) {
              Write-Host ""
              Write-Host "RESULT:"
              Write-Host $result
          }
          else {
              Write-Host ""
              Write-Host "No ID returned by --get-id."
          }

      # ==========================================
      # 7. Check RustDesk Service
      # ==========================================
      - name: Check RustDesk Service
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK SERVICE"
          Write-Host "======================================"

          $services = Get-Service |
            Where-Object {
              $_.Name -like "*RustDesk*" -or
              $_.DisplayName -like "*RustDesk*"
            }

          if ($services) {
              $services |
                Select-Object Name, DisplayName, Status, StartType |
                Format-Table -AutoSize
          }
          else {
              Write-Host "No RustDesk Windows service found."
          }

      # ==========================================
      # 8. Keep Windows Runner Alive
      # ==========================================
      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "WINDOWS RUNNER IS ALIVE"
          Write-Host "RUSTDESK PROCESS IS RUNNING"
          Write-Host "KEEPING SESSION ALIVE"
          Write-Host "======================================"

          Start-Sleep -Seconds 18000
