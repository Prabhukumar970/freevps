name: Windows RustDesk

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ==========================================================
      # 1. DOWNLOAD RUSTDESK
      # ==========================================================
      - name: Download RustDesk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.1/rustdesk-1.2.1-x86_64.exe"
          $installer = "$env:TEMP\rustdesk.exe"

          Write-Host "======================================"
          Write-Host "DOWNLOADING RUSTDESK"
          Write-Host "======================================"

          curl.exe -L --retry 3 --connect-timeout 20 `
            -o "$installer" "$url"

          if (!(Test-Path $installer)) {
              Write-Error "RustDesk download failed."
              exit 1
          }

          $size = (Get-Item $installer).Length

          Write-Host "Downloaded size: $size bytes"

          if ($size -lt 1000000) {
              Write-Error "Downloaded file looks invalid."
              exit 1
          }

          Write-Host "Download successful."


      # ==========================================================
      # 2. INSTALL RUSTDESK
      # ==========================================================
      - name: Install RustDesk
        shell: powershell
        run: |
          $installer = "$env:TEMP\rustdesk.exe"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "INSTALLING RUSTDESK"
          Write-Host "======================================"

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "--silent-install" `
            -PassThru

          Write-Host "Installer PID: $($process.Id)"

          # Wait maximum 60 seconds
          if (!$process.WaitForExit(60000)) {

              Write-Host "Installer is still running after 60 seconds."
              Write-Host "Stopping installer to prevent workflow hang."

              Stop-Process `
                -Id $process.Id `
                -Force `
                -ErrorAction SilentlyContinue

          }
          else {

              Write-Host "Installer exited with code: $($process.ExitCode)"

          }

          Start-Sleep -Seconds 5

          $paths = @(
            "C:\Program Files\RustDesk\rustdesk.exe",
            "C:\Program Files\RustDesk\RustDesk.exe",
            "C:\Program Files (x86)\RustDesk\rustdesk.exe",
            "C:\Program Files (x86)\RustDesk\RustDesk.exe"
          )

          $rustdesk = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (!$rustdesk) {

              Write-Error "RustDesk executable was not found."

              Write-Host "Checking Program Files..."
              Get-ChildItem "C:\Program Files" -Directory `
                -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like "*Rust*" }

              exit 1
          }

          Write-Host ""
          Write-Host "RustDesk installed:"
          Write-Host $rustdesk


      # ==========================================================
      # 3. START RUSTDESK
      # ==========================================================
      - name: Start RustDesk
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files\RustDesk\rustdesk.exe",
            "C:\Program Files\RustDesk\RustDesk.exe",
            "C:\Program Files (x86)\RustDesk\rustdesk.exe",
            "C:\Program Files (x86)\RustDesk\RustDesk.exe"
          )

          $rustdesk = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          Write-Host ""
          Write-Host "======================================"
          Write-Host "STARTING RUSTDESK"
          Write-Host "======================================"

          Write-Host "Executable:"
          Write-Host $rustdesk

          # Remove old RustDesk processes
          Get-Process -Name rustdesk `
            -ErrorAction SilentlyContinue |
            Stop-Process -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          # Start RustDesk
          Start-Process `
            -FilePath $rustdesk `
            -WindowStyle Hidden

          Write-Host "RustDesk started."

          # Give RustDesk time to initialize
          Start-Sleep -Seconds 15

          Write-Host ""
          Write-Host "RustDesk processes:"

          Get-Process -Name rustdesk `
            -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, Path |
            Format-Table -AutoSize


      # ==========================================================
      # 4. GET ID - SAFE VERSION
      # ==========================================================
      - name: Get RustDesk ID
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
              $rustdesk = "C:\Program Files\RustDesk\RustDesk.exe"
          }

          if (!(Test-Path $rustdesk)) {
              Write-Error "RustDesk executable not found."
              exit 1
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "GETTING RUSTDESK ID"
          Write-Host "======================================"

          Write-Host "Executable:"
          Write-Host $rustdesk

          # IMPORTANT:
          # RustDesk Windows CLI may produce no visible output
          # unless output is piped through another command.
          #
          # We use CMD + MORE and impose a timeout so this
          # step cannot hang forever.

          $outputFile = "$env:TEMP\rustdesk_id.txt"

          if (Test-Path $outputFile) {
              Remove-Item $outputFile -Force
          }

          $workDir = Split-Path $rustdesk

          Write-Host ""
          Write-Host "Running RustDesk --get-id..."

          $job = Start-Job -ScriptBlock {

              param($dir, $file)

              Set-Location $dir

              cmd.exe /c ".\rustdesk.exe --get-id | more" |
                Out-File -FilePath $file -Encoding ascii

          } -ArgumentList $workDir, $outputFile

          # Maximum 30 seconds
          $completed = Wait-Job `
            -Job $job `
            -Timeout 30

          if (!$completed) {

              Write-Host ""
              Write-Host "WARNING: --get-id did not finish within 30 seconds."

              Stop-Job $job -ErrorAction SilentlyContinue
              Remove-Job $job -Force -ErrorAction SilentlyContinue

              Write-Host "Continuing without blocking the workflow."

          }
          else {

              Receive-Job $job `
                -ErrorAction SilentlyContinue

              Remove-Job $job `
                -Force `
                -ErrorAction SilentlyContinue

          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK ID OUTPUT"
          Write-Host "======================================"

          if (Test-Path $outputFile) {

              $raw = Get-Content $outputFile -Raw `
                -ErrorAction SilentlyContinue

              Write-Host $raw

              $clean = $raw.Trim()

              if ([string]::IsNullOrWhiteSpace($clean)) {

                  Write-Host ""
                  Write-Host "RustDesk returned no visible ID."

              }
              else {

                  Write-Host ""
                  Write-Host "Possible RustDesk ID:"
                  Write-Host $clean

              }

          }
          else {

              Write-Host "No output file was created."

          }

          Write-Host "======================================"


      # ==========================================================
      # 5. SET A PERMANENT PASSWORD
      # ==========================================================
      - name: Set RustDesk Password
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
              $rustdesk = "C:\Program Files\RustDesk\RustDesk.exe"
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "SETTING RUSTDESK PASSWORD"
          Write-Host "======================================"

          # Temporary test password.
          # Change this before using the machine for anything sensitive.
          $password = "TestRD@8472"

          Write-Host "Applying RustDesk password..."

          $job = Start-Job -ScriptBlock {

              param($exe, $pw)

              & $exe --password $pw 2>&1 |
                Out-String

          } -ArgumentList $rustdesk, $password

          $completed = Wait-Job `
            -Job $job `
            -Timeout 30

          if (!$completed) {

              Write-Host "Password command timed out."
              Stop-Job $job -ErrorAction SilentlyContinue

          }
          else {

              $result = Receive-Job $job `
                -ErrorAction SilentlyContinue

              Write-Host $result

          }

          Remove-Job $job `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Password configured:"
          Write-Host $password

          Write-Host "======================================"


      # ==========================================================
      # 6. CHECK RUSTDESK FILES
      # ==========================================================
      - name: Check RustDesk Configuration
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK CONFIGURATION"
          Write-Host "======================================"

          $folders = @(
            "$env:APPDATA\RustDesk",
            "$env:PROGRAMDATA\RustDesk",
            "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk",
            "C:\Windows\ServiceProfiles\LocalService\AppData\Local\RustDesk"
          )

          foreach ($folder in $folders) {

              Write-Host ""
              Write-Host "Checking:"
              Write-Host $folder

              if (Test-Path $folder) {

                  Get-ChildItem `
                    $folder `
                    -Recurse `
                    -File `
                    -ErrorAction SilentlyContinue |
                    Select-Object FullName, Length |
                    Format-Table -AutoSize

              }
              else {

                  Write-Host "Folder not found."

              }
          }


      # ==========================================================
      # 7. FINAL STATUS
      # ==========================================================
      - name: RustDesk Status
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "FINAL RUSTDESK STATUS"
          Write-Host "======================================"

          $processes = Get-Process `
            -Name rustdesk `
            -ErrorAction SilentlyContinue

          if ($processes) {

              Write-Host "RustDesk process is RUNNING."

              $processes |
                Select-Object Id, ProcessName, Path |
                Format-Table -AutoSize

          }
          else {

              Write-Host "WARNING: RustDesk process is NOT running."

          }

          Write-Host "======================================"


      # ==========================================================
      # 8. KEEP RUNNER ALIVE
      # ==========================================================
      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK IS RUNNING"
          Write-Host "WINDOWS RUNNER IS ALIVE"
          Write-Host "KEEPING SESSION ALIVE"
          Write-Host "======================================"

          Start-Sleep -Seconds 20400
