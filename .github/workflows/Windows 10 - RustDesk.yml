name: Windows RustDesk

on:
  workflow_dispatch:

jobs:
  windows:
    name: Start Windows RustDesk
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # =========================================
      # 1. Download RustDesk
      # =========================================
      - name: Download RustDesk
        shell: powershell
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.1/rustdesk-1.2.1-x86_64.exe"
          $exe = "$env:TEMP\rustdesk.exe"

          Write-Host "Downloading RustDesk..."

          curl.exe -L --retry 5 --retry-delay 5 `
            -o "$exe" `
            "$url"

          if (!(Test-Path $exe)) {
              Write-Host "Download failed."
              exit 1
          }

          $size = (Get-Item $exe).Length

          Write-Host "Downloaded file size: $size bytes"

          if ($size -lt 1000000) {
              Write-Host "Downloaded file looks invalid."
              exit 1
          }

          Write-Host "RustDesk downloaded successfully."

      # =========================================
      # 2. Install RustDesk
      # =========================================
      - name: Install RustDesk
        shell: powershell
        run: |
          $exe = "$env:TEMP\rustdesk.exe"

          Write-Host "Installing RustDesk..."

          $p = Start-Process `
            -FilePath $exe `
            -ArgumentList "--silent-install" `
            -PassThru

          Write-Host "Installer PID: $($p.Id)"

          $finished = $p.WaitForExit(60000)

          if (!$finished) {
              Write-Host "Installer did not finish within 60 seconds."

              Stop-Process `
                -Id $p.Id `
                -Force `
                -ErrorAction SilentlyContinue
          }

          Start-Sleep -Seconds 5

          $paths = @(
              "C:\Program Files\RustDesk\rustdesk.exe",
              "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          )

          $rustdesk = $paths |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

          if (!$rustdesk) {
              Write-Host "RustDesk executable not found."
              exit 1
          }

          Write-Host "RustDesk installed successfully."
          Write-Host "Path: $rustdesk"

      # =========================================
      # 3. Start RustDesk
      # =========================================
      - name: Start RustDesk
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
              $rustdesk = "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          }

          if (!(Test-Path $rustdesk)) {
              Write-Host "RustDesk executable not found."
              exit 1
          }

          Write-Host "Starting RustDesk..."

          Start-Process `
            -FilePath $rustdesk `
            -WindowStyle Hidden

          Start-Sleep -Seconds 20

          $process = Get-Process `
            -Name "rustdesk" `
            -ErrorAction SilentlyContinue

          if ($process) {
              Write-Host "RustDesk process is running."
          }
          else {
              Write-Host "RustDesk process is NOT running."
              exit 1
          }

      # =========================================
      # 4. Diagnose RustDesk
      # =========================================
      - name: Diagnose RustDesk
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
              $rustdesk = "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK EXECUTABLE"
          Write-Host "======================================"
          Write-Host $rustdesk

          # ---------------------------------------
          # Process
          # ---------------------------------------
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK PROCESS"
          Write-Host "======================================"

          Get-Process `
            -Name rustdesk `
            -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, Path

          # ---------------------------------------
          # Config files
          # ---------------------------------------
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK CONFIG FILES"
          Write-Host "======================================"

          $configLocations = @(
              "$env:APPDATA\RustDesk\config",
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config"
          )

          foreach ($dir in $configLocations) {

              Write-Host ""
              Write-Host "Checking:"
              Write-Host $dir

              if (Test-Path $dir) {

                  Get-ChildItem `
                    -Path $dir `
                    -File `
                    -ErrorAction SilentlyContinue |
                    Select-Object Name, Length, LastWriteTime
              }
          }

          # ---------------------------------------
          # Logs
          # ---------------------------------------
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK LOG FILES"
          Write-Host "======================================"

          $logLocations = @(
              "$env:APPDATA\RustDesk\log",
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\log"
          )

          foreach ($dir in $logLocations) {

              Write-Host ""
              Write-Host "Checking:"
              Write-Host $dir

              if (Test-Path $dir) {

                  Get-ChildItem `
                    -Path $dir `
                    -Recurse `
                    -File `
                    -ErrorAction SilentlyContinue |
                    Select-Object FullName, Length, LastWriteTime
              }
          }

          # ---------------------------------------
          # CLI Help
          # ---------------------------------------
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK CLI HELP"
          Write-Host "======================================"

          & $rustdesk --help 2>&1

          # ---------------------------------------
          # Get ID test
          # ---------------------------------------
          Write-Host ""
          Write-Host "======================================"
          Write-Host "GET ID TEST"
          Write-Host "======================================"

          $idResult = & $rustdesk --get-id 2>&1

          Write-Host "Command result:"
          Write-Host $idResult

          # ---------------------------------------
          # Service check
          # ---------------------------------------
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK SERVICES"
          Write-Host "======================================"

          Get-Service |
            Where-Object {
              $_.Name -match "RustDesk" -or
              $_.DisplayName -match "RustDesk"
            } |
            Select-Object Name, DisplayName, Status, StartType

      # =========================================
      # 5. Keep Runner Alive
      # =========================================
      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK IS RUNNING"
          Write-Host "WINDOWS RUNNER IS ALIVE"
          Write-Host "KEEPING SESSION ALIVE"
          Write-Host "======================================"

          Start-Sleep -Seconds 18000
