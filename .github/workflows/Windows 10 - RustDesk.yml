name: Windows RustDesk

on:
  workflow_dispatch:

jobs:
  windows:
    name: Start Windows RustDesk
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ==============================
      # 1. Download RustDesk
      # ==============================
      - name: Download RustDesk
        shell: powershell
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.1/rustdesk-1.2.1-x86_64.exe"
          $exe = "$env:TEMP\rustdesk.exe"

          Write-Host "Downloading RustDesk..."

          curl.exe -L --retry 5 --retry-delay 5 `
            -o "$exe" `
            "$url"

          if (!(Test-Path $exe)) {
              Write-Host "Download failed."
              exit 1
          }

          $size = (Get-Item $exe).Length

          Write-Host "File size: $size bytes"

          if ($size -lt 1000000) {
              Write-Host "Invalid RustDesk file."
              exit 1
          }

          Write-Host "Download successful."

      # ==============================
      # 2. Install RustDesk
      # ==============================
      - name: Install RustDesk
        shell: powershell
        run: |
          $exe = "$env:TEMP\rustdesk.exe"

          Write-Host "Installing RustDesk..."

          $p = Start-Process `
            -FilePath $exe `
            -ArgumentList "--silent-install" `
            -PassThru

          Write-Host "Installer PID: $($p.Id)"

          $finished = $p.WaitForExit(60000)

          if (!$finished) {
              Write-Host "Installer timeout."
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

          Start-Sleep -Seconds 5

          $paths = @(
              "C:\Program Files\RustDesk\rustdesk.exe",
              "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          )

          $rustdesk = $paths |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

          if (!$rustdesk) {
              Write-Host "RustDesk executable not found."
              exit 1
          }

          Write-Host "RustDesk installed:"
          Write-Host $rustdesk

      # ==============================
      # 3. Start RustDesk
      # ==============================
      - name: Start RustDesk
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
              $rustdesk = "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          }

          Write-Host "Starting RustDesk..."

          Start-Process `
            -FilePath $rustdesk `
            -WindowStyle Hidden

          Start-Sleep -Seconds 20

          $process = Get-Process `
            -Name "rustdesk" `
            -ErrorAction SilentlyContinue

          if ($process) {
              Write-Host "RustDesk process is running."
          }
          else {
              Write-Host "RustDesk process is NOT running."
              exit 1
          }

      # ==============================
      # 4. Search RustDesk Config
      # ==============================
      - name: Find RustDesk ID
        shell: powershell
        run: |
          Write-Host "Searching for RustDesk configuration..."

          $locations = @(
              "$env:APPDATA\RustDesk",
              "$env:PROGRAMDATA\RustDesk",
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk",
              "C:\Windows\ServiceProfiles\LocalService\AppData\Local\RustDesk"
          )

          foreach ($location in $locations) {

              Write-Host ""
              Write-Host "Checking:"
              Write-Host $location

              if (Test-Path $location) {

                  Get-ChildItem `
                    -Path $location `
                    -Recurse `
                    -Force `
                    -ErrorAction SilentlyContinue |
                    Select-Object FullName, Length
              }
          }

          Write-Host ""
          Write-Host "Trying RustDesk command..."

          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
              $rustdesk = "C:\Program Files (x86)\RustDesk\rustdesk.exe"
          }

          & $rustdesk --get-id

          Write-Host ""
          Write-Host "RustDesk ID search completed."

      # ==============================
      # 5. Keep Runner Alive
      # ==============================
      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "Keeping Windows runner alive..."

          Start-Sleep -Seconds 18000
