name: Windows RustDesk

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # 1. Download RustDesk
      - name: Download RustDesk
        shell: powershell
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.1/rustdesk-1.2.1-x86_64.exe"
          $installer = "$env:TEMP\rustdesk.exe"

          Write-Host "Downloading RustDesk..."
          curl.exe -L --retry 3 --connect-timeout 20 `
            -o "$installer" "$url"

          if (!(Test-Path $installer)) {
              Write-Error "RustDesk download failed."
              exit 1
          }

          $size = (Get-Item $installer).Length
          Write-Host "Downloaded size: $size bytes"

          if ($size -lt 1000000) {
              Write-Error "Downloaded RustDesk file looks invalid."
              exit 1
          }

          Write-Host "RustDesk download OK."


      # 2. Install RustDesk WITHOUT waiting forever
      - name: Install RustDesk
        shell: powershell
        run: |
          $installer = "$env:TEMP\rustdesk.exe"

          Write-Host "Installing RustDesk..."

          $p = Start-Process `
            -FilePath $installer `
            -ArgumentList "--silent-install" `
            -PassThru

          Write-Host "Installer started. PID: $($p.Id)"

          # Maximum 60 seconds wait
          if (!$p.WaitForExit(60000)) {
              Write-Host "Installer did not exit within 60 seconds."
              Write-Host "Stopping installer..."
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          else {
              Write-Host "Installer exited with code: $($p.ExitCode)"
          }

          Start-Sleep -Seconds 5

          $paths = @(
            "C:\Program Files\RustDesk\rustdesk.exe",
            "C:\Program Files\RustDesk\RustDesk.exe",
            "C:\Program Files (x86)\RustDesk\rustdesk.exe",
            "C:\Program Files (x86)\RustDesk\RustDesk.exe"
          )

          $rustdesk = $paths | Where-Object {
              Test-Path $_
          } | Select-Object -First 1

          if (!$rustdesk) {
              Write-Error "RustDesk executable was not found."
              exit 1
          }

          Write-Host "RustDesk installed:"
          Write-Host $rustdesk


      # 3. Start RustDesk
      - name: Start RustDesk
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files\RustDesk\rustdesk.exe",
            "C:\Program Files\RustDesk\RustDesk.exe",
            "C:\Program Files (x86)\RustDesk\rustdesk.exe",
            "C:\Program Files (x86)\RustDesk\RustDesk.exe"
          )

          $rustdesk = $paths | Where-Object {
              Test-Path $_
          } | Select-Object -First 1

          Write-Host "RustDesk path:"
          Write-Host $rustdesk

          Get-Process rustdesk -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          Start-Process `
            -FilePath $rustdesk `
            -WindowStyle Hidden

          Write-Host "RustDesk started."

          Start-Sleep -Seconds 15

          Write-Host ""
          Write-Host "RustDesk processes:"
          Get-Process rustdesk -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, Path


      # 4. Try to get RustDesk ID
      - name: Get RustDesk ID
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files\RustDesk\rustdesk.exe",
            "C:\Program Files\RustDesk\RustDesk.exe",
            "C:\Program Files (x86)\RustDesk\rustdesk.exe",
            "C:\Program Files (x86)\RustDesk\RustDesk.exe"
          )

          $rustdesk = $paths | Where-Object {
              Test-Path $_
          } | Select-Object -First 1

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK INFORMATION"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Executable:"
          Write-Host $rustdesk

          Write-Host ""
          Write-Host "Trying to get ID..."

          $result = & $rustdesk --get-id 2>&1 | Out-String

          Write-Host "Command output:"
          Write-Host $result

          Write-Host ""
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($result)) {
              Write-Host "RustDesk ID was NOT returned by CLI."
              Write-Host "RustDesk process is still running."
          }
          else {
              Write-Host "RustDesk CLI returned:"
              Write-Host $result
          }

          Write-Host "======================================"


      # 5. Check RustDesk folders/config
      - name: Check RustDesk Files
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK FILES"
          Write-Host "======================================"

          $folders = @(
            "$env:APPDATA\RustDesk",
            "$env:PROGRAMDATA\RustDesk",
            "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk",
            "C:\Windows\ServiceProfiles\LocalService\AppData\Local\RustDesk"
          )

          foreach ($folder in $folders) {

              Write-Host ""
              Write-Host "Checking:"
              Write-Host $folder

              if (Test-Path $folder) {

                  Get-ChildItem $folder -Recurse -File -ErrorAction SilentlyContinue |
                    Select-Object FullName, Length |
                    Format-Table -AutoSize

              }
              else {
                  Write-Host "Folder not found."
              }
          }


      # 6. Keep GitHub Windows runner alive
      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK IS RUNNING"
          Write-Host "WINDOWS RUNNER IS ALIVE"
          Write-Host "KEEPING SESSION ALIVE"
          Write-Host "======================================"
          Write-Host ""

          Start-Sleep -Seconds 20400
